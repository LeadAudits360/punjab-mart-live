<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders · Punjab Mart</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1B140F;--cream:#FFF6E8;--paper:#FBEBD2;--maroon:#5a0d14;--saffron:#F28C1B;--green:#1F5E3B;--muted:#6d5f52}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--cream);color:var(--ink);min-height:100vh}
header{background:var(--maroon);color:var(--cream);padding:16px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
header img{height:42px;background:var(--cream);border-radius:8px;padding:2px 6px}
header h1{font-family:'Bricolage Grotesque';font-size:22px}
header .sp{flex:1}
.pill{background:rgba(255,246,232,.15);padding:6px 12px;border-radius:999px;font-size:13px}
.pill.on{background:#3FA34D}
button{font-family:inherit;cursor:pointer}
#alerts{border:0;border-radius:999px;padding:8px 14px;font-weight:600;background:var(--saffron);color:var(--ink)}
.tabs{display:flex;gap:8px;padding:16px 22px 0;flex-wrap:wrap}
.tabs button{border:1px solid rgba(27,20,15,.15);background:#fff;border-radius:999px;padding:8px 14px;font-weight:600}
.tabs button.act{background:var(--ink);color:var(--cream)}
main{padding:18px 22px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:#fff;border-radius:18px;padding:18px;border:1px solid rgba(27,20,15,.08);display:flex;flex-direction:column;gap:10px}
.card.new{border:2px solid var(--saffron);animation:glow 1.6s ease-in-out 3}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(242,140,27,.25)}}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ref{font-family:'Bricolage Grotesque';font-size:22px;font-weight:800}
.ch{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.ch.website{background:#eef2ff;color:#3730a3}.ch.whatsapp{background:#dcfce7;color:#166534}.ch.instagram{background:#fce7f3;color:#9d174d}
.who{font-size:14px;color:var(--muted)}
.who a{color:var(--ink);font-weight:600}
ul{list-style:none;font-size:14.5px;border-top:1px dashed rgba(27,20,15,.15);padding-top:8px}
li{display:flex;justify-content:space-between;padding:3px 0}
.tot{display:flex;justify-content:space-between;font-weight:700}
.st{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em}
.st.new{color:var(--saffron)}.st.ready{color:var(--green)}.st.picked{color:var(--muted)}.st.cancelled{color:#b91c1c}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{border:0;border-radius:999px;padding:9px 14px;font-weight:700;font-size:13px}
.b-ready{background:var(--green);color:#fff}.b-picked{background:var(--ink);color:var(--cream)}.b-cancel{background:#f3e8e8;color:#991b1b}
.note{font-size:12.5px;color:var(--muted)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:60px 0}
</style>
</head>
<body>
<header>
  <img src="/logo.webp" alt="Punjab Mart">
  <h1>Pickup orders</h1>
  <span class="sp"></span>
  <span class="pill" id="pWa">WhatsApp</span><span class="pill" id="pIg">Instagram</span>
  <button id="alerts">🔔 Turn on sound alerts</button>
</header>
<div class="tabs" id="tabs">
  <button data-f="open" class="act">Open</button><button data-f="all">All</button><button data-f="picked">Picked up</button>
</div>
<main id="list"><p class="empty">Loading orders…</p></main>
<script>
let filter='open',known=null,sound=false,ctx=null;
const list=document.getElementById('list');
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago=t=>{const m=Math.round((Date.now()-new Date(t))/60000);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' h ago':new Date(t).toLocaleDateString()};
function beep(){if(!sound)return;try{ctx=ctx||new AudioContext();[0,.18].forEach(d=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=880;o.connect(g);g.connect(ctx.destination);g.gain.setValueAtTime(.2,ctx.currentTime+d);o.start(ctx.currentTime+d);o.stop(ctx.currentTime+d+.12)})}catch(e){}}
document.getElementById('alerts').onclick=e=>{sound=true;e.target.textContent='🔔 Sound alerts on';beep()};
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.f;[...e.currentTarget.children].forEach(x=>x.classList.toggle('act',x===b));load()};
async function setStatus(ref,status){const r=await fetch('/api/orders/'+ref+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});const d=await r.json();
  if(status==='ready')alert(d.notified?'Customer has been messaged that the order is ready.':d.notifyError?'Marked ready, but the message could not be sent: '+d.notifyError:'Marked ready. Please call the customer (website order).');load()}
async function load(){
  let d;try{const r=await fetch('/api/orders',{cache:'no-store'});d=await r.json()}catch(e){return}
  document.getElementById('pWa').classList.toggle('on',d.wa);document.getElementById('pIg').classList.toggle('on',d.ig);
  const ids=new Set(d.orders.map(o=>o.ref));
  const fresh=known?d.orders.filter(o=>!known.has(o.ref)):[];if(fresh.length){beep();document.title='('+fresh.length+') New order · Punjab Mart'}
  known=ids;
  const rows=d.orders.filter(o=>filter==='all'||(filter==='open'?['new','ready'].includes(o.status):o.status==='picked'));
  if(!rows.length){list.innerHTML='<p class="empty">No orders here yet. New orders appear automatically.</p>';return}
  list.innerHTML=rows.map(o=>`<div class="card ${fresh.find(f=>f.ref===o.ref)?'new':''}">
    <div class="top"><span class="ref">${esc(o.ref)}</span><span class="ch ${esc(o.channel)}">${esc(o.channel)}</span></div>
    <div class="who">${esc(o.name)||'Customer'}${o.phone?` · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>`:''} · ${ago(o.at)}</div>
    <ul>${o.items.map(i=>`<li><span>${i.qty} × ${esc(i.name)}</span><span>$${(i.price*i.qty).toFixed(2)}</span></li>`).join('')}</ul>
    <div class="tot"><span>Estimated total</span><span>$${(o.total||0).toFixed(2)}</span></div>
    ${o.note?`<div class="note">Note: ${esc(o.note)}</div>`:''}
    <div class="st ${esc(o.status)}">${{new:'New',ready:'Ready for pickup',picked:'Picked up',cancelled:'Cancelled'}[o.status]||esc(o.status)}</div>
    <div class="acts">${o.status==='new'?`<button class="b-ready" onclick="setStatus('${o.ref}','ready')">Packed · notify customer</button>`:''}
      ${['new','ready'].includes(o.status)?`<button class="b-picked" onclick="setStatus('${o.ref}','picked')">Picked up</button><button class="b-cancel" onclick="setStatus('${o.ref}','cancelled')">Cancel</button>`:''}</div>
  </div>`).join('');
}
load();setInterval(load,15000);
</script>
</body>
</html>
